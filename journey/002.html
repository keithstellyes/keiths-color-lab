<!DOCTYPE html>
<head>
    <meta charset="UTF-8"></meta>
    <script src="../components/opengl-canvas.js" defer></script>
    <script src="../components/image-filter.js" defer></script>
    <script src="../components/citations.js" defer></script>
    <script src="../components/page-controls.js" defer></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
    <!-- needed for image-filter -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kalam">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Four bit depths across, undithered on top and dithered below. */
        #matrix {
            display: grid;
            grid-template-columns: repeat(4, max-content);
            gap: 12px;
        }
    </style>
</head>
<body>
    <p id="mobileWarning" class="callout" hidden>
    This page is not supported on mobile.
    </p>
    <p>
    One bit of gray is only the beginning. Upload a photo below and the whole
    matrix fills in at once: 1, 2, 4, and 8 bits of gray, each one shown
    without dithering and then with the random dither from the last page.
    </p>
    <image-filter id="source" vertex-shader="../shaders/texture.vert"
                  fragment-shader="../shaders/texture.frag">
    </image-filter>

    <div id="matrix">
        <image-filter no-upload title="1 bit" data-bits="1" data-dither="0"
                      vertex-shader="../shaders/texture.vert"
                      fragment-shader="../shaders/nbits-grayscale.frag">
        </image-filter>
        <image-filter no-upload title="2 bits" data-bits="2" data-dither="0"
                      vertex-shader="../shaders/texture.vert"
                      fragment-shader="../shaders/nbits-grayscale.frag">
        </image-filter>
        <image-filter no-upload title="4 bits" data-bits="4" data-dither="0"
                      vertex-shader="../shaders/texture.vert"
                      fragment-shader="../shaders/nbits-grayscale.frag">
        </image-filter>
        <image-filter no-upload title="8 bits" data-bits="8" data-dither="0"
                      vertex-shader="../shaders/texture.vert"
                      fragment-shader="../shaders/nbits-grayscale.frag">
        </image-filter>

        <image-filter no-upload title="1 bit, dithered" data-bits="1" data-dither="1"
                      vertex-shader="../shaders/texture.vert"
                      fragment-shader="../shaders/nbits-grayscale.frag">
        </image-filter>
        <image-filter no-upload title="2 bits, dithered" data-bits="2" data-dither="1"
                      vertex-shader="../shaders/texture.vert"
                      fragment-shader="../shaders/nbits-grayscale.frag">
        </image-filter>
        <image-filter no-upload title="4 bits, dithered" data-bits="4" data-dither="1"
                      vertex-shader="../shaders/texture.vert"
                      fragment-shader="../shaders/nbits-grayscale.frag">
        </image-filter>
        <image-filter no-upload title="8 bits, dithered" data-bits="8" data-dither="1"
                      vertex-shader="../shaders/texture.vert"
                      fragment-shader="../shaders/nbits-grayscale.frag">
        </image-filter>
    </div>
    <script>
        // userAgentData.mobile is the non-sniffing answer, but it's
        // Chromium-only and reports false for tablets, which are just as
        // cramped for a 4-wide grid. So the user agent string gets a look too.
        const isMobile = () => Boolean(navigator.userAgentData?.mobile)
            || /Mobi|Android|iPhone|iPad|iPod|Tablet/i.test(navigator.userAgent);

        if (isMobile()) {
            document.getElementById("mobileWarning").hidden = false;
        }
    </script>
    <script>
        // The component scripts are deferred, so the elements are not upgraded
        // until parsing finishes -- wait for that before touching uniforms.
        document.addEventListener("DOMContentLoaded", () => {
            const source = document.getElementById("source");
            const cells = document.querySelectorAll("#matrix image-filter");

            for (const cell of cells) {
                cell.uniform1f("u_bits", Number(cell.dataset.bits));
                cell.uniform1f("u_dither", Number(cell.dataset.dither));
            }

            // Only the polaroid up top takes an upload; it hands the decoded
            // image to every cell so the whole matrix shows the same photo.
            source.addEventListener("image", event => {
                for (const cell of cells) {
                    cell.setImage(event.detail);
                }
            });
        });
    </script>
    <next-page>
        003.html
    </next-page>

    <hr/>
    <cite-biblio></cite-biblio>
</body>

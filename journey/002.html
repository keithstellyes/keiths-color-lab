<!DOCTYPE html>
<head>
    <meta charset="UTF-8"></meta>
    <script src="../components/opengl-canvas.js" defer></script>
    <script src="../components/image-filter.js" defer></script>
    <script src="../components/citations.js" defer></script>
    <script src="../components/page-controls.js" defer></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
    <!-- needed for image-filter -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kalam">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <p>
    </p>
    <image-filter id="nbits" vertex-shader="../shaders/texture.vert"
                  fragment-shader="../shaders/nbits-grayscale.frag">
    </image-filter>
    <fieldset id="bitsControl">
        <legend>bits of gray</legend>
        <label><input type="radio" name="bits" value="1" checked/> 1</label>
        <label><input type="radio" name="bits" value="2"/> 2</label>
        <label><input type="radio" name="bits" value="4"/> 4</label>
        <label><input type="radio" name="bits" value="8"/> 8</label>
    </fieldset>
    <fieldset>
        <legend> Apply random dither? </legend>
        <input type="checkbox" id="dither"/>
    </fieldset>
    <script>
        // The component scripts are deferred, so the element is not upgraded
        // until parsing finishes -- wait for it before touching uniforms.
        document.addEventListener("DOMContentLoaded", () => {
            const filter = document.getElementById("nbits");
            const radios = document
                .getElementById("bitsControl")
                .querySelectorAll("input[name=bits]");

            const setBits = bits => {
                filter.uniform1f("u_bits", bits);

                // Nothing to redraw until the shaders have loaded and an
                // image has been picked
                if (filter.ready) {
                    filter.draw();
                }
            };

            for (const radio of radios) {
                radio.addEventListener("change", () => {
                    setBits(Number(radio.value));
                });

                if (radio.checked) {
                    setBits(Number(radio.value));
                }
            }
            const ditherEl = document.getElementById("dither");
            ditherEl.addEventListener("change", (e) => {
                filter.uniform1f("u_dither", e.target.checked ? 1.0 : 0.0);
                filter.draw();
            });
        });
    </script>
    <p>
    <hr/>
    <cite-biblio></cite-biblio>
</body>
